name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Callable from the deploy workflow, so a tag is held to the same checks a
  # pull request is.
  workflow_call:

# A second push to the same branch cancels the first: a facility repo does not
# need three superseded runs finishing after the one that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Nothing in CI writes to the repository, and a token
# with more rights than a job needs is the one that gets borrowed by a
# compromised dependency during `npm ci`.
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Catches what the type checker cannot see. An effect that reads a value
      # it never declared is perfectly well typed and renders last request's
      # data; the react-hooks rules are the reason this step exists.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npx vite build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PostgreSQL is the only engine Reticle runs on, so it is the only engine
    # the suite runs on. There is nothing lighter to fall back to, and that is
    # the point: the login throttle once joined two fields with a NUL byte,
    # which a PostgreSQL text column cannot hold at all — every login would have
    # failed the day it was deployed, and a suite running against something more
    # forgiving would have reported it green.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reticle
          POSTGRES_PASSWORD: ci-only-not-a-real-password
          POSTGRES_DB: reticle_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      RETICLE_TEST_DATABASE_URL: postgresql+psycopg://reticle:ci-only-not-a-real-password@localhost:5432/reticle_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      # --require-hashes against the lock, exactly as the deploy installs.
      # Ranges resolved fresh on each run mean CI and production test different
      # dependency sets, and the one nobody tested is the one in production.
      - run: pip install --require-hashes -r requirements-dev.lock

      # A dependency added to requirements.txt without regenerating the lock
      # would be installed by nothing and noticed by nobody until an import
      # failed on the server.
      - name: The locks cover what the requirements ask for
        run: python ../.github/scripts/check_locks.py

      # The Python half of what ESLint does for the frontend. Catches unused
      # imports, undefined names, mutable defaults and the bandit checks worth
      # having at lint level - one of which found that the importer would
      # happily fetch a file:// URL out of a source payload.
      - name: Lint
        run: ruff check .

      # Formatting is checked rather than applied, so a badly-formatted commit
      # fails here instead of turning up as noise in somebody else's diff.
      - name: Formatting
        run: ruff format --check .

      # Before the suite, and against a database of its own, so that a migration
      # which fails on a real server fails here rather than on a facility's
      # machine mid-deploy. The suite creates its schema from the models, so
      # nothing else would run the migrations end to end.
      - name: Migrations run against a real server
        env:
          RETICLE_SECRET_KEY: ci-only-secret-not-used-anywhere-real-0000
          RETICLE_DATABASE_URL: postgresql+psycopg://reticle:ci-only-not-a-real-password@localhost:5432/reticle_migrations
        run: |
          PGPASSWORD=ci-only-not-a-real-password createdb -h localhost -U reticle reticle_migrations
          alembic upgrade head

      - name: Tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  restore-rehearsal:
    name: Restore rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A backup nobody has restored is a hypothesis. The suite already proves
    # the round trip in-process; this proves the *command* an operator would
    # actually type, through a real archive on a real filesystem, and fails if
    # anything is missing or a checksum does not match.
    #
    # Two databases on the same server, because that is the shape of the real
    # thing: the corpus is exported from one machine and restored onto another,
    # and a restore that quietly wrote back into the database it came from would
    # pass a comparison of one database with itself.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reticle
          POSTGRES_PASSWORD: ci-only-not-a-real-password
          POSTGRES_DB: reticle_origin
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      RETICLE_SECRET_KEY: ci-only-secret-not-used-anywhere-real-0000
      RETICLE_ADMIN_EMAIL: ci@example.org
      RETICLE_ADMIN_PASSWORD: ci-only-password-not-real
      ORIGIN_URL: postgresql+psycopg://reticle:ci-only-not-a-real-password@localhost:5432/reticle_origin
      RESTORED_URL: postgresql+psycopg://reticle:ci-only-not-a-real-password@localhost:5432/reticle_restored
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - run: pip install --require-hashes -r requirements.lock

      # The origin database comes with the service; the destination is the
      # empty server somebody restores onto.
      - name: Create the database restored into
        run: PGPASSWORD=ci-only-not-a-real-password createdb -h localhost -U reticle reticle_restored

      - name: Seed a corpus
        env:
          RETICLE_DATABASE_URL: ${{ env.ORIGIN_URL }}
          RETICLE_MEDIA_ROOT: ./origin_media
        run: python -m app.seed

      - name: Export it
        env:
          RETICLE_DATABASE_URL: ${{ env.ORIGIN_URL }}
          RETICLE_MEDIA_ROOT: ./origin_media
        run: python -m app.portability export --archive ./backup.tar.gz

      # Into an empty database, as it would be on a new server. `restore` exits
      # non-zero if a file is missing or a checksum fails, so a silent partial
      # restore cannot pass.
      - name: Restore into an empty database
        env:
          RETICLE_DATABASE_URL: ${{ env.RESTORED_URL }}
          RETICLE_MEDIA_ROOT: ./restored_media
        run: python -m app.portability restore --from ./backup.tar.gz

      - name: Compare the two corpora
        env:
          RETICLE_DATABASE_URL: ${{ env.RESTORED_URL }}
          RETICLE_MEDIA_ROOT: ./restored_media
        run: |
          python - <<'PY'
          import json, subprocess, os, sys

          def export(name, db, media):
              environment = {**os.environ, "RETICLE_DATABASE_URL": db, "RETICLE_MEDIA_ROOT": media}
              out = f"/tmp/{name}"
              subprocess.run(
                  [sys.executable, "-m", "app.portability", "export", "--out", out],
                  check=True, env=environment,
              )
              return json.load(open(f"{out}/reticle-export.json"))

          origin = export("origin", os.environ["ORIGIN_URL"], "./origin_media")
          restored = export("restored", os.environ["RESTORED_URL"], "./restored_media")

          for section in ("guides", "pages", "categories", "tags", "media"):
              if origin[section] != restored[section]:
                  print(f"MISMATCH in {section}", file=sys.stderr)
                  raise SystemExit(1)
          print("restore is faithful:", origin["reticleExport"]["counts"])
          PY

      # A static snapshot needs no software at all to read, so it is the last
      # line of defence and is worth proving buildable on every run.
      - name: Build the offline snapshot
        env:
          RETICLE_DATABASE_URL: ${{ env.RESTORED_URL }}
          RETICLE_MEDIA_ROOT: ./restored_media
        run: python -m app.portability publish --out ./snapshot

  scripts:
    name: Deploy scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # These run as root on a facility's server and create databases. An unquoted
    # variable here is a worse bug than an unquoted variable in the application,
    # because there is no test suite exercising them and the failure happens
    # once, in production, during provisioning.
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck deploy/*.sh
      # `|| true` used to disarm this entirely, which hid StartLimitBurst
      # sitting in [Service] - where systemd has ignored it since v230, so the
      # documented crash-loop protection silently did nothing.
      #
      # The one complaint that has to be tolerated is the missing ExecStart
      # binary: the unit points into /opt/reticle, which exists on a facility
      # server and not on a runner. Everything else - an unknown key, a
      # malformed directive, a bad section - now fails the build.
      - name: systemd unit parses
        run: |
          output=$(systemd-analyze verify deploy/reticle@.service 2>&1 || true)
          echo "$output"
          if echo "$output" | grep -v 'is not executable' | grep -q .; then
            echo "::error::systemd-analyze reported a problem beyond the missing binary"
            exit 1
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Reports known vulnerabilities in what is actually installed. It does not
    # fail the build: an advisory against a transitive package with no fix
    # available would block every unrelated change until somebody upstream
    # acts, and a red build that cannot be made green teaches people to ignore
    # red builds. The output is read on the weekly Dependabot pass.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Python dependencies
        working-directory: backend
        run: |
          pip install pip-audit
          # The lock, not the ranges: this should report on the versions that
          # actually get installed, down to the transitive ones.
          pip-audit -r requirements.lock --desc

      - name: JavaScript dependencies
        working-directory: frontend
        run: |
          npm ci
          # Production dependencies only. A build-tool advisory is a different
          # risk from one in code that is served to a browser, and mixing them
          # means neither gets read.
          npm audit --omit=dev

  e2e:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend, backend]
    # The browser exercises the application as a facility runs it, which means
    # against PostgreSQL. A smoke test on some other engine proves the pages
    # render, not that they render against the database they will be served
    # from.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reticle
          POSTGRES_PASSWORD: ci-only-not-a-real-password
          POSTGRES_DB: reticle_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RETICLE_SECRET_KEY: ci-only-secret-not-used-anywhere-real-0000
      RETICLE_COOKIE_SECURE: 'false'
      RETICLE_DATABASE_URL: postgresql+psycopg://reticle:ci-only-not-a-real-password@localhost:5432/reticle_ci
      RETICLE_MEDIA_ROOT: ./ci_media
      RETICLE_ADMIN_EMAIL: ci@example.org
      RETICLE_ADMIN_PASSWORD: ci-only-password-not-real
      RETICLE_E2E_EMAIL: ci@example.org
      RETICLE_E2E_PASSWORD: ci-only-password-not-real
      # The browser talks to nginx, not to Vite. Everything below exists to
      # make that origin as close to a facility's as a runner can get.
      RETICLE_E2E_BASE: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The application, from the lock a facility installs. The demonstration
      # corpus below is filled by `tools/demo_corpus.py`, which talks to the
      # running instance over HTTP and needs a client to do it — and the
      # application itself never imports one, so httpx is a development
      # dependency and this job installed neither it nor anything it pulls in.
      # The tool is a development tool, so it gets the development lock; still
      # hash-pinned, and still on top of the production lock rather than instead
      # of it, so what the browser then exercises is the same set of versions a
      # facility runs.
      - name: Install backend
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      # The exact bytes the `frontend` job built and the deploy ships, rather
      # than a second build that might differ. Without this the artifact is
      # produced on every run and loaded by nothing.
      - name: Take the production build from the frontend job
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Seed the database
        working-directory: backend
        run: python -m app.seed

      - name: Start the backend
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/health

      # The browser tests need a library to browse, and seeding no longer makes
      # one: a facility's sections are the facility's, so the seeder creates the
      # administrator and stops. The demonstration corpus is where content that
      # nobody's facility wrote belongs, and it arrives through the HTTP API the
      # way a person would — which makes this a better exercise than the rows
      # the seeder used to insert, because the endpoints are under test too.
      - name: Fill the instance with the demonstration corpus
        run: |
          python tools/demo_corpus.py \
            --base-url http://127.0.0.1:8000 \
            --email "$RETICLE_ADMIN_EMAIL" \
            --password "$RETICLE_ADMIN_PASSWORD"

      # A single origin serving the built files and proxying /api, which is what
      # a facility has. Against the Vite dev server instead, nothing ever loads
      # the minified bundle and nothing is subject to the
      # Content-Security-Policy — so a policy that blocks the application is
      # discovered by a user.
      - name: Serve the build behind nginx
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx-light

          mkdir -p ci-nginx/tmp ci-nginx/logs

          # The policy itself comes from the real template, so there is one copy
          # of it and CI cannot enforce a policy no facility gets. MEDIA_ORIGIN
          # is empty here, as it is for local-disk media.
          sed -e 's|{{MEDIA_ORIGIN}}||g' \
              -e 's|{{SLUG}}|ci|g' -e 's|{{DOMAIN}}|localhost|g' \
              deploy/nginx-security-headers.conf.template > ci-nginx/headers.conf

          sed -e "s|{{ROOT}}|$PWD/frontend/dist|g" \
              -e "s|{{HEADERS}}|$PWD/ci-nginx/headers.conf|g" \
              .github/workflows/nginx-ci.conf > ci-nginx/site.conf

          cat > ci-nginx/nginx.conf <<CONF
          worker_processes 1;
          error_log $PWD/ci-nginx/logs/error.log;
          pid $PWD/ci-nginx/nginx.pid;
          events { worker_connections 64; }
          http {
            include /etc/nginx/mime.types;
            access_log off;
            client_body_temp_path $PWD/ci-nginx/tmp;
            proxy_temp_path $PWD/ci-nginx/tmp/proxy;
            fastcgi_temp_path $PWD/ci-nginx/tmp/fastcgi;
            uwsgi_temp_path $PWD/ci-nginx/tmp/uwsgi;
            scgi_temp_path $PWD/ci-nginx/tmp/scgi;
            include $PWD/ci-nginx/site.conf;
          }
          CONF

          # nginx workers run as www-data and have to read the build.
          chmod -R a+rX "$PWD/frontend/dist" "$PWD/ci-nginx"

          sudo nginx -t -c "$PWD/ci-nginx/nginx.conf"
          sudo nginx -c "$PWD/ci-nginx/nginx.conf"

          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/ >/dev/null
          curl -sf http://127.0.0.1:8080/api/health

      # nginx's add_header does not stack: a location that sets one of its own
      # discards every header it would have inherited, and the location that
      # answers with index.html sets a Cache-Control. Every security header
      # therefore reached nothing that runs JavaScript. It is silent — no error,
      # no log line, just a page with no policy — so it is asserted rather than
      # reviewed.
      - name: Every response carries the security headers
        run: |
          asset=$(basename "$(ls frontend/dist/assets/*.js | head -1)")
          fail=0
          for path in / /index.html /g/some-guide "/assets/$asset" /api/config; do
            headers=$(curl -sI "http://127.0.0.1:8080$path")
            for header in content-security-policy strict-transport-security \
                          x-frame-options x-content-type-options referrer-policy; do
              if ! printf '%s' "$headers" | grep -qi "^$header:"; then
                echo "::error::$path is missing $header"
                fail=1
              fi
            done
          done
          exit "$fail"

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        working-directory: frontend
        run: node e2e/smoke.mjs

      # The authoring round-trip writes a guide the way a person does and reads
      # it back. It is the only check that would notice the editor saving
      # something the reader cannot render — which a component test cannot see,
      # because both sides of it would be mocked.
      - name: Authoring round-trip
        working-directory: frontend
        run: node e2e/cms.mjs

      # Screenshots are the fastest way to see why a run failed, so keep them
      # whatever the outcome.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: frontend/e2e/shots
          retention-days: 7

      - name: nginx log, if something went wrong
        if: failure()
        run: cat ci-nginx/logs/error.log || true
