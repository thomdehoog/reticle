name: Deploy

# Deployment runs on a version tag, or on demand. It is deliberately inert
# until the repository is configured: the DEPLOY_HOST variable acts as the
# on-switch, so forking or cloning this repo cannot accidentally push to a ZMB
# server.
#
# Required repository VARIABLES (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST     e.g. reticle.zmb.uzh.ch
#   DEPLOY_USER     the service account that owns /opt/reticle
#   DEPLOY_PATH     e.g. /opt/reticle
# Required repository SECRETS:
#   DEPLOY_SSH_KEY  private key for DEPLOY_USER
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan <host>` — pinning this is what
#                       stops a hijacked DNS entry receiving the deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build release bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npx vite build

      - name: Assemble the bundle
        run: |
          mkdir -p bundle
          cp -r backend bundle/backend
          rm -rf bundle/backend/tests bundle/backend/.pytest_cache
          find bundle/backend -name '__pycache__' -type d -prune -exec rm -rf {} +
          cp -r frontend/dist bundle/static
          cp README.md LICENSE NOTICE.md bundle/
          tar -czf reticle-${{ github.ref_name }}.tar.gz -C bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: reticle-bundle
          path: reticle-*.tar.gz
          retention-days: 30

  deploy:
    name: Deploy to ZMB
    runs-on: ubuntu-latest
    needs: build
    if: vars.DEPLOY_HOST != ''
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reticle-bundle

      - name: Authorise SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # The database and the media store live outside the release directory and
      # are never touched here, so a bad release is rolled back by pointing the
      # symlink at the previous one — no restore required.
      - name: Ship and switch
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
          PATH_ON_HOST: ${{ vars.DEPLOY_PATH }}
          RELEASE: ${{ github.ref_name }}
        run: |
          BUNDLE=$(ls reticle-*.tar.gz)
          scp "$BUNDLE" "$USER@$HOST:/tmp/$BUNDLE"
          ssh "$USER@$HOST" bash -euo pipefail <<EOF
            RELEASE_DIR="$PATH_ON_HOST/releases/$RELEASE"
            mkdir -p "\$RELEASE_DIR"
            tar -xzf "/tmp/$BUNDLE" -C "\$RELEASE_DIR"
            rm "/tmp/$BUNDLE"

            python3 -m venv "\$RELEASE_DIR/venv"
            "\$RELEASE_DIR/venv/bin/pip" install --quiet -r "\$RELEASE_DIR/backend/requirements.txt"

            ln -sfn "$PATH_ON_HOST/shared/.env" "\$RELEASE_DIR/backend/.env"
            ln -sfn "\$RELEASE_DIR" "$PATH_ON_HOST/current"

            sudo systemctl restart reticle
            sleep 3
            curl -sf http://127.0.0.1:8000/api/health
          EOF

      - name: Verify the site answers
        run: curl -sf "https://${{ vars.DEPLOY_HOST }}/api/health"
