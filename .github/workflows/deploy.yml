name: Deploy

# Deployment runs on a version tag, or on demand. It is deliberately inert
# until the repository is configured: the DEPLOY_HOST variable acts as the
# on-switch, so forking or cloning this repo cannot accidentally push to a ZMB
# server.
#
# Required repository VARIABLES (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST     e.g. reticle.zmb.uzh.ch
#   DEPLOY_USER     the service account that owns /opt/reticle
#   DEPLOY_PATH     e.g. /opt/reticle
# Required repository SECRETS:
#   DEPLOY_SSH_KEY  private key for DEPLOY_USER
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan <host>` — pinning this is what
#                       stops a hijacked DNS entry receiving the deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # The tag being deployed has to pass the same checks a pull request does.
  # Without this, `git tag v1.2.3 && git push --tags` ships whatever is on that
  # commit — and a tag is exactly the moment somebody is in a hurry.
  verify:
    name: Verify the tag
    uses: ./.github/workflows/ci.yml

  build:
    name: Build release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npx vite build

      - name: Assemble the bundle
        run: |
          mkdir -p bundle
          cp -r backend bundle/backend
          rm -rf bundle/backend/tests bundle/backend/.pytest_cache
          find bundle/backend -name '__pycache__' -type d -prune -exec rm -rf {} +
          cp -r frontend/dist bundle/static
          cp README.md LICENSE NOTICE.md bundle/
          tar -czf reticle-${{ github.ref_name }}.tar.gz -C bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: reticle-bundle
          path: reticle-*.tar.gz
          retention-days: 30

  deploy:
    name: Deploy to ZMB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: vars.DEPLOY_HOST != ''
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reticle-bundle

      - name: Authorise SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # The database and the media store live outside the release directory, so
      # a bad release is rolled back by pointing the symlink at the previous
      # one. That is only true while migrations stay additive — see
      # MAINTENANCE.md. A destructive migration breaks rollback, which is why
      # the backup below is taken before anything runs and not after.
      - name: Ship, back up, migrate, switch
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
          PATH_ON_HOST: ${{ vars.DEPLOY_PATH }}
          RELEASE: ${{ github.ref_name }}
        run: |
          BUNDLE=$(ls reticle-*.tar.gz)
          scp "$BUNDLE" "$USER@$HOST:/tmp/$BUNDLE"
          ssh "$USER@$HOST" bash -euo pipefail <<EOF
            RELEASE_DIR="$PATH_ON_HOST/releases/$RELEASE"
            SHARED="$PATH_ON_HOST/shared"

            # What the symlink points at right now, recorded before it moves.
            # This is what the rollback step below returns to, and reading it
            # afterwards would read the release that just failed.
            PREVIOUS=\$(readlink -f "$PATH_ON_HOST/current" || true)
            echo "\$PREVIOUS" > /tmp/reticle-previous-release

            mkdir -p "\$RELEASE_DIR"
            tar -xzf "/tmp/$BUNDLE" -C "\$RELEASE_DIR"
            rm "/tmp/$BUNDLE"

            python3 -m venv "\$RELEASE_DIR/venv"
            "\$RELEASE_DIR/venv/bin/pip" install --quiet -r "\$RELEASE_DIR/backend/requirements.txt"
            ln -sfn "\$SHARED/.env" "\$RELEASE_DIR/backend/.env"

            # Every facility on this host. One process per facility, all
            # running the same release - so the symlink moves once and each
            # facility is migrated and restarted in turn.
            FACILITIES=\$(ls -1 "$PATH_ON_HOST/facilities" 2>/dev/null || true)
            if [ -z "\$FACILITIES" ]; then
              echo "No facilities under $PATH_ON_HOST/facilities. Run provision-facility.sh first." >&2
              exit 1
            fi

            ln -sfn "\$RELEASE_DIR" "$PATH_ON_HOST/current"

            # Backs up each facility, then migrates it, and stops at the first
            # failure rather than leaving some facilities on a new schema and
            # some not. The old code is still serving at this point.
            "\$RELEASE_DIR/deploy/migrate-all.sh"

            for facility in \$FACILITIES; do
              sudo systemctl restart "reticle@\$facility"

              # Readiness, not liveness, and the facility's own port. The
              # process answers /api/health before it can reach the database,
              # so waiting on that would call a release good while it is
              # still broken.
              PORT=\$(sed -n "s/^RETICLE_PORT='\\?\\([0-9]*\\)'\\?\$/\\1/p" \
                "$PATH_ON_HOST/facilities/\$facility/env")
              ready=false
              for attempt in \$(seq 1 30); do
                if curl -sf "http://127.0.0.1:\$PORT/api/ready" >/dev/null; then
                  ready=true
                  break
                fi
                sleep 2
              done
              if [ "\$ready" != true ]; then
                echo "\$facility never became ready on port \$PORT" >&2
                exit 1
              fi
              echo "\$facility ready"
            done
          EOF

      - name: Verify the public site answers
        run: |
          curl -sf "https://${{ vars.DEPLOY_HOST }}/api/ready"
          curl -sf "https://${{ vars.DEPLOY_HOST }}/api/health"

      # Release directories each carry their own virtualenv, so without this a
      # host fills up on a schedule. Five is enough to roll back further than
      # anybody ever does.
      - name: Prune old releases and backups
        if: success()
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
          PATH_ON_HOST: ${{ vars.DEPLOY_PATH }}
        run: |
          ssh "$USER@$HOST" bash -euo pipefail <<EOF
            cd "$PATH_ON_HOST/releases"
            ls -1dt */ | tail -n +6 | xargs -r rm -rf
            find "$PATH_ON_HOST/facilities" -name 'pre-migrate-*.tar.gz' -mtime +30 -delete
          EOF

      # Only on failure, and only back to the release that was live before this
      # run. An automatic rollback is safe here precisely because the database
      # was backed up first and migrations are additive: the previous code can
      # read the new schema.
      - name: Roll back
        if: failure()
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
          PATH_ON_HOST: ${{ vars.DEPLOY_PATH }}
        run: |
          ssh "$USER@$HOST" bash -euo pipefail <<EOF
            PREVIOUS=\$(cat /tmp/reticle-previous-release 2>/dev/null || true)
            if [ -z "\$PREVIOUS" ] || [ ! -d "\$PREVIOUS" ]; then
              echo "no previous release recorded; leaving the server as it is" >&2
              exit 1
            fi
            ln -sfn "\$PREVIOUS" "$PATH_ON_HOST/current"
            for attempt in \$(seq 1 30); do
              curl -sf http://127.0.0.1:8000/api/ready >/dev/null && exit 0
              sleep 2
            done
            echo "rolled back and it is still not ready - this needs a person" >&2
            exit 1
          EOF
