# The origin the browser tests run against in CI.
#
# It exists so that the thing CI exercises is the thing that gets deployed. The
# Vite dev server serves unminified modules from memory and applies no policy at
# all, so browser tests pointed at it never load the production build and never
# meet the Content-Security-Policy. A breakage that appears only in the built
# output then ships unseen.
#
# This mirrors the location structure of deploy/nginx-facility.conf.template.
# TLS, HTTP/2 and the port-80 redirect are left out because a runner has no
# certificate and the tests speak plain HTTP to 127.0.0.1; everything that can
# affect what a browser does with the page is the same.
#
# The security headers are NOT copied here. They are included from the real
# template, so the policy CI enforces is the policy a facility gets, and there
# is no second copy to drift.
#
# {{ROOT}} and {{HEADERS}} are substituted by the workflow.

server {
    # IPv4 only. The tests connect to 127.0.0.1, and a runner without an IPv6
    # loopback refuses to start nginx at all on a `listen [::]` line.
    listen 8080;
    server_name localhost;

    include {{HEADERS}};

    client_max_body_size 210M;

    root {{ROOT}};
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        include {{HEADERS}};
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include {{HEADERS}};
    }

    # The block that actually answers with the HTML document, because both
    # try_files and `index` redirect internally to this exact path. Its
    # Cache-Control is what discards every inherited header if the include is
    # missing — which is the whole reason CI asserts on the headers below.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include {{HEADERS}};
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Request-ID      $request_id;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
        include {{HEADERS}};
    }
}
