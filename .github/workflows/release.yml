name: Release

# Pushing a version tag publishes a release:
#
#   git tag v1.2.0 && git push origin v1.2.0
#
#   ghcr.io/<owner>/reticle-app:1.2.0   (also :1.2 and, for a stable version, :latest)
#   ghcr.io/<owner>/reticle-web:1.2.0
#   a GitHub release carrying reticle-deploy-1.2.0.tar.gz — compose.yaml,
#   .env.example and the deploy/ scripts, which is everything a server needs.
#
# The tag must be v<major>.<minor>.<patch>, optionally with a pre-release
# suffix (v1.3.0-rc.1). Anything else is refused before a single step runs
# with it.
#
# Nothing here connects to a ZMB machine. The server pulls; see "Upgrading" in
# docs/DEPLOYMENT.md. A university host is not reachable from GitHub's runners,
# and a deploy key that can log in to it should not live in a repository's
# secrets when `deploy/upgrade.sh` on the host does the same job.
#
# Needs no configuration: images are pushed with the workflow's own token. The
# first time, make the two packages public (or log the server in to ghcr.io)
# under github.com/<owner>?tab=packages.
#
# The two rules at the top of ci.yml apply here with more force, because this
# workflow holds a token that can publish: actions pinned to commit SHAs, and
# no workflow expression inside a `run:` script — a tag name is text chosen by
# whoever can push a tag, and it must never be pasted into a shell.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # First, and with no permissions and no checkout: is this tag a version?
  # The filter above is a glob and lets "v1.2.3-anything at all" through; this
  # is the real check, and every later job depends on it.
  tag:
    name: Check the tag
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: The tag is v<major>.<minor>.<patch>[-<pre-release>]
        id: check
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != tag ]; then
            echo "::error::this workflow only runs for tags" >&2
            exit 1
          fi
          pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'
          if ! printf '%s\n' "$TAG" | grep -Eqx -- "$pattern" || [ "$(printf '%s' "$TAG" | wc -l)" -ne 0 ]; then
            echo "::error::the tag is not a version of the form v1.2.3 or v1.2.3-rc.1; nothing was built" >&2
            exit 1
          fi
          version="${TAG#v}"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $version (pre-release: $prerelease)"

  # No image is published from a commit that fails its tests.
  verify:
    name: CI
    needs: tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [tag, verify]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: reticle-app
            dockerfile: backend/Dockerfile
          - image: reticle-web
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # GHCR image names must be lower case; repository owners need not be.
      - name: Image name
        id: name
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 -> 1.2.3, 1.2 and latest. A pre-release (v1.3.0-rc.1) gets only
      # its own tag: `latest` never moves to something unfinished. (`latest`
      # exists for people trying Reticle out; compose.yaml has no default
      # version, so no server follows it by accident.)
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=auto

      # linux/amd64 only: that is what the servers are. To publish for ARM as
      # well, add docker/setup-qemu-action before buildx and set
      # `platforms: linux/amd64,linux/arm64` — the frontend stage already
      # builds natively whatever the target.
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: RETICLE_VERSION=${{ needs.tag.outputs.version }}
          # What went into the image and how it was built, stored next to it
          # in the registry:  docker buildx imagetools inspect <image>
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [tag, images]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Everything a server needs to run the published images, and nothing it
      # does not: no source, no build. The bundle pins the version it was cut
      # from, so "which release is this host on" is one line in its .env.
      - name: Assemble the deployment bundle
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          root="reticle-$VERSION"
          mkdir -p "$root/docs"
          cp compose.yaml .env.example LICENSE NOTICE.md "$root/"
          cp docs/DEPLOYMENT.md docs/MAINTENANCE.md "$root/docs/"
          cp -r deploy "$root/deploy"
          rm -rf "$root/deploy/docker" "$root/deploy/caddy"
          sed -i \
            -e "s|^#\{0,1\}RETICLE_VERSION=.*|RETICLE_VERSION=$VERSION|" \
            -e "s|^#\{0,1\}RETICLE_IMAGE_PREFIX=.*|RETICLE_IMAGE_PREFIX=ghcr.io/$owner|" \
            "$root/.env.example"
          test "$(grep -c '^RETICLE_VERSION=' "$root/.env.example")" = 1
          grep -qxF "RETICLE_VERSION=$VERSION" "$root/.env.example"
          grep -qxF "RETICLE_IMAGE_PREFIX=ghcr.io/$owner" "$root/.env.example"
          tar -czf "reticle-deploy-$VERSION.tar.gz" "$root"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.tag.outputs.version }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
        run: |
          set -- "$TAG" "reticle-deploy-$VERSION.tar.gz" --verify-tag --generate-notes
          if [ "$PRERELEASE" = true ]; then
            set -- "$@" --prerelease
          fi
          gh release create "$@"
