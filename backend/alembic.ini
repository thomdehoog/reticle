# Alembic configuration for the Reticle backend.
#
# The database URL is deliberately not in this file: migrations/env.py reads
# RETICLE_DATABASE_URL through the application's own settings, so the schema is
# always migrated on the database the application will actually open.
#
# `python -m app.migrate` is the one command an operator needs. This file exists
# so that the alembic command line also works for a developer writing the next
# migration:
#
#   alembic revision --autogenerate -m "describe the change"
#   alembic upgrade head

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
