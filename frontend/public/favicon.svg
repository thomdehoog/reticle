<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Reticle mark (original artwork, see NOTICE.md): a circle crossed by
       eyepiece graticule lines, as in the application header, on the header's
       own dark blue so it reads on light and dark browser tabs alike. -->
  <title>Reticle</title>
  <rect width="32" height="32" rx="7" fill="#06214f"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round">
    <circle cx="16" cy="16" r="9"/>
    <path d="M16 3.5v6M16 22.5v6M3.5 16h6M22.5 16h6"/>
  </g>
  <circle cx="16" cy="16" r="2.8" fill="#ffffff"/>
</svg>
