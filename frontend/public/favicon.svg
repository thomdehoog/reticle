<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Reticle">
  <!--
    The tab icon: a reticle, which is the crosshair etched into a microscope
    eyepiece and the thing the software is named after.

    Drawn here rather than exported from a drawing program so that it is a
    dozen lines of geometry anyone can edit, and so that no third party's
    artwork enters the repository. The four ticks stop short of the centre the
    way a real graticule does, leaving the middle clear for the specimen.

    One file for both themes: the disc is the brand blue at every size, and the
    strokes are the page background, so it reads on a light tab strip and on a
    dark one without a second drawing or a media query.
  -->
  <rect width="32" height="32" rx="7" fill="#0d3b8c" />
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none">
    <circle cx="16" cy="16" r="8.5" />
    <path d="M16 3.5v5M16 23.5v5M3.5 16h5M23.5 16h5" />
  </g>
  <circle cx="16" cy="16" r="1.6" fill="#ffffff" />
</svg>
